name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: version
    attributes:
      label: RustBin version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and browser
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (remove credentials and paste content)
